<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBuddy AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6eaf2;font-family:Arial,Helvetica,sans-serif;color:#19275b}.shell{display:flex;flex-direction:column;align-items:center;padding:16px 10px 34px;gap:10px}.intro{text-align:center;max-width:440px;font-size:13px;line-height:1.5}.intro b{font-size:19px}.phone{width:min(100%,390px);position:relative;box-shadow:0 12px 42px #15224635;border-radius:3px;overflow:hidden;background:#f3f5fd}.phone img{display:block;width:100%;height:auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:3;padding:0}.hot:focus-visible{outline:3px solid #faad36;outline-offset:-3px;background:#ffcd5c33}.hot:hover{background:#006fe711}.nav{position:absolute;left:0;bottom:0;width:100%;height:7%;display:flex;z-index:5}.nav button{flex:1;border:0;background:transparent;cursor:pointer}.nav button:focus-visible{outline:3px solid #ffb700;outline-offset:-4px}.overlay{position:absolute;background:#fff;z-index:2}.dynamic{position:absolute;z-index:2;color:#19275b}.modal-shade{position:fixed;inset:0;background:#0b173b99;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(95vw,420px);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 15px 60px #0004}.modal h2{margin:0 0 14px;font-size:22px}.modal p{line-height:1.5}.modal label{display:block;font-weight:bold;margin:12px 0 5px}.modal input,.modal select,.modal textarea{width:100%;border:1px solid #9aadd0;border-radius:8px;padding:11px;font:inherit}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:1px solid #c5d5ef;background:white;color:#19275b;padding:12px 16px;border-radius:10px;cursor:pointer;font-weight:bold;flex:1}.btn.primary{background:#086ce3;color:white;border-color:#086ce3}.notice{font-size:12px;color:#52638d}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #c7d6f3;border-radius:12px;padding:12px;margin:7px 0;color:#19275b;cursor:pointer;font-size:14px}.choice.selected{background:#dbeaff;border:2px solid #086ce3}.minirow{display:flex;gap:6px;align-items:center;font-size:12px}.minirow button{border:1px solid #b7c9e9;border-radius:6px;padding:4px 8px;background:white;cursor:pointer}.status{font-size:12px;text-align:center;color:#52638d}.reviewitem{border-bottom:1px solid #ddd;padding:9px 0;font-size:14px}.reviewitem b{display:block}.small{font-size:13px}.kbd{font-size:11px;opacity:.7}.top-note{margin:0;color:#566486}
</style></head><body><div class="shell"><div class="phone" id="phone" aria-label="StudyBuddy mobile app"></div></div><div id="dialog"></div><script>
const root=document.getElementById('phone'), dialog=document.getElementById('dialog'),status={set textContent(value){}};
const imgs={Home:'StudyBuddy Main Dashboard.png',Planner:'StudyBuddy Study Planner.png',Upload:'StudyBuddy Upload Summarize.png',Practice:'StudyBuddy Practice Questions.png',Feedback:'StudyBuddy Feedback.png'};
let page='Home',assignments=[{name:'Lab 4 report',course:'CS 101',due:'Fri, 11:59 PM',done:false},{name:'Problem Set 6',course:'MATH 210',due:'Mon, 9:00 AM',done:false},{name:'Essay draft',course:'ENG 120',due:'Wed, 5:00 PM',done:false}],studyDay=2,planned=false,hasFile=false,summary=false,filename='Bio_Ch5_Notes.pdf',hours=3,exam='';
const questions=[
['Which cell structure contains most of a eukaryotic cell’s DNA?',['Nucleus','Ribosome','Cell membrane','Cytoplasm'],0,'Cell structure'],
['What is the main function of the cell membrane?',['Produce glucose','Regulate what enters and leaves the cell','Store genetic information','Make ATP'],1,'Cell structure'],
['Which organelle is the main site of photosynthesis?',['Mitochondrion','Nucleus','Chloroplast','Golgi apparatus'],2,'Photosynthesis'],
['What gas do plants absorb during photosynthesis?',['Oxygen','Nitrogen','Hydrogen','Carbon dioxide'],3,'Photosynthesis'],
['What is the main purpose of cellular respiration?',['Produce usable ATP energy','Build the cell wall','Absorb sunlight','Store DNA'],0,'Cellular respiration'],
['In which organelle does most aerobic respiration occur?',['Chloroplast','Mitochondrion','Nucleus','Vacuole'],1,'Cellular respiration'],
['What is the role of ribosomes?',['Store water','Transport oxygen','Build proteins','Digest food'],2,'Cell structure'],
['Which substance is a product of photosynthesis?',['Carbon dioxide','Nitrogen','Methane','Glucose'],3,'Photosynthesis'],
['Which molecule is the cell’s immediate energy currency?',['ATP','DNA','Cellulose','Chlorophyll'],0,'Cellular respiration'],
['Which process breaks down glucose to release energy?',['Photosynthesis','Cellular respiration','Osmosis','Transcription'],1,'Cellular respiration']
];
let qi=0,selected=null,answers=Array(10).fill(null),finished=false;
const pct=(v)=>v/780*100+'%';
function hot(x,y,w,h,fn,aria){const b=document.createElement('button');b.className='hot';b.style.cssText=`left:${pct(x)};top:${y/1688*100}%;width:${pct(w)};height:${h/1688*100}%`;b.onclick=fn;b.setAttribute('aria-label',aria);root.appendChild(b);return b}
function over(x,y,w,h,html,css=''){let d=document.createElement('div');d.className='overlay';d.style.cssText=`left:${pct(x)};top:${y/1688*100}%;width:${pct(w)};height:${h/1688*100}%;${css}`;d.innerHTML=html;root.appendChild(d);return d}
function textAt(x,y,w,h,html,css=''){let d=over(x,y,w,h,html,`background:transparent;${css}`);d.className='dynamic';return d}
function navigate(p){page=p;render();status.textContent=`${p} screen — `}
function modal(title,body,buttons){dialog.innerHTML=`<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<div class="actions">${buttons.map((b,i)=>`<button class="btn ${b.primary?'primary':''}" data-i="${i}">${b.text}</button>`).join('')}</div></section></div>`;buttons.forEach((b,i)=>dialog.querySelector(`[data-i="${i}"]`).onclick=b.fn);}
function close(){dialog.innerHTML=''}
function nav(){let n=document.createElement('div');n.className='nav';Object.keys(imgs).forEach(p=>{let b=document.createElement('button');b.setAttribute('aria-label','Go to '+p);b.onclick=()=>navigate(p);n.appendChild(b)});root.appendChild(n)}
function render(){root.innerHTML=`<img src="assets/${imgs[page]}" alt="${page} screen design">`;if(page==='Home')home();if(page==='Planner')planner();if(page==='Upload')upload();if(page==='Practice')practice();if(page==='Feedback')feedback();nav()}
function home(){assignments.slice(0,3).forEach((a,i)=>{let y=222+i*200;over(58,y,662,172,`<div style="font-weight:bold;font-size:clamp(12px,3.7vw,16px);padding:12px 4px 0">${esc(a.name)} ${a.done?'✓':''}</div><div style="font-size:clamp(11px,3vw,13px);color:#5a688b;padding:3px 4px">${esc(a.course)}</div><div style="font-size:clamp(11px,3vw,13px);color:#5a688b;padding:8px 4px">Due: ${esc(a.due)}</div>`,`background:#fff;`);hot(638,y+18,79,105,()=>{a.done=!a.done;render()},'Mark '+a.name+' complete');textAt(660,y+41,45,45,a.done?'☑':'☐','font-size:25px;color:#086ce3;pointer-events:none')});hot(42,820,697,94,addAssignment,'Add assignment');}
function addAssignment(){modal('Add assignment',`<label for="an">Assignment name</label><input id="an" placeholder="e.g. Chapter 6 reading"><label for="ac">Course</label><input id="ac" placeholder="e.g. BIO 101"><label for="ad">Due date</label><input id="ad" type="datetime-local">`,[{text:'Cancel',fn:close},{text:'Save assignment',primary:true,fn:()=>{let n=document.getElementById('an').value.trim(),c=document.getElementById('ac').value.trim(),d=document.getElementById('ad').value;if(!n||!c||!d){alert('Please enter the assignment, course, and due date.');return}assignments.unshift({name:n,course:c,due:new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),done:false});close();render();status.textContent='Assignment added to Home.'}}])}
// Study sessions are stored by calendar date so each day has its own list.
const todayForPlanner=new Date();todayForPlanner.setHours(12,0,0,0);
const mondayForPlanner=new Date(todayForPlanner);mondayForPlanner.setDate(todayForPlanner.getDate()-(todayForPlanner.getDay()+6)%7);
let plannerWeek=new Date(mondayForPlanner),plannerSelected=new Date(mondayForPlanner);
plannerSelected.setDate(plannerWeek.getDate()+3); // Thursday sample from the design
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parseLocalDate(v){let [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12)}
const sessionsByDate={};
sessionsByDate[dateKey(plannerSelected)]=[{topic:'Biology chapter review',time:'09:00',duration:45},{topic:'Practice biology quiz',time:'14:00',duration:30},{topic:'Review weak topics',time:'18:00',duration:45}];
function timeLabel(t){let [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function addStudySession(){modal('Add study session',`<p class="notice">For ${plannerSelected.toLocaleDateString('en-US',{weekday:'long'})}</p><label for="topic">Study topic</label><input id="topic" placeholder="e.g. Biology exam review"><label for="stime">Start time</label><input id="stime" type="time" value="15:00"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="10" max="600" value="45">`,[{text:'Cancel',fn:close},{text:'Add session',primary:true,fn:()=>{let topic=document.getElementById('topic').value.trim(),time=document.getElementById('stime').value,duration=Number(document.getElementById('duration').value);if(!topic||!time||!Number.isFinite(duration)||duration<10||duration>600){alert('Enter a topic, start time, and duration from 10 to 600 minutes.');return}let key=dateKey(plannerSelected);(sessionsByDate[key]??=[]).push({topic,time,duration});sessionsByDate[key].sort((a,b)=>a.time.localeCompare(b.time));close();render()}}])}
function planner(){
 const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
 // Replace the static weekday labels so the active day matches the schedule shown.
 over(38,206,705,121,`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:100%;align-items:center">${days.map((d,i)=>{let date=new Date(plannerWeek);date.setDate(plannerWeek.getDate()+i);let active=dateKey(date)===dateKey(plannerSelected);return `<button data-day="${i}" aria-label="${d}, ${date.toLocaleDateString()}" style="height:72%;border:1px solid #cbd9f4;border-radius:12px;background:${active?'#086ce3':'white'};color:${active?'white':'#19275b'};font-size:clamp(12px,3.4vw,16px);cursor:pointer">${d[0]}</button>`}).join('')}</div>`,`background:#f4f6fd`);
 root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{plannerSelected=new Date(plannerWeek);plannerSelected.setDate(plannerWeek.getDate()+Number(b.dataset.day));render()});
 // Keep the original screenshot's simple "Week of [date]" placeholder; no calendar picker.
 // Header text is part of the original screenshot; do not overlay it.
 let key=dateKey(plannerSelected),entries=sessionsByDate[key]||[];
 const cards=entries.length?entries.map(s=>`<div style="background:#fff;border:2px dashed #888;border-radius:14px;margin:10px 0;padding:12px 13px;font-size:clamp(12px,3.3vw,15px)"><b>${timeLabel(s.time)}</b><span style="float:right;color:#65718f">${s.duration} min</span><div style="margin-top:7px;overflow-wrap:anywhere">${esc(s.topic)}</div></div>`).join(''):'<div style="background:white;border:2px dashed #b7c5e1;border-radius:14px;margin-top:16px;padding:24px 12px;text-align:center;font-size:14px;color:#5a688b">No study sessions for this day.<div style="margin-top:6px">Add a session below to get started.</div></div>';
 over(43,341,695,626,`<div style="font-weight:bold;font-size:clamp(14px,4vw,18px);padding:10px 14px 0">${days[(plannerSelected.getDay()+6)%7]}</div><div style="padding:0 2px;max-height:89%;overflow-y:auto">${cards}</div>`,`background:#f4f6fd`);
 hot(40,984,700,135,settings,'Edit schedule settings');
 hot(42,1140,697,100,generateStudySchedule,'Generate study schedule');
 hot(42,1250,697,101,addStudySession,'Add session manually');
}
function generateStudySchedule(){
 const key=dateKey(plannerSelected);
 // A simple prototype simulation, not an AI service. Keep manually added sessions.
 const templates=[
  {topic:'Biology chapter review',time:'09:00',duration:60},
  {topic:'Computer Science assignment',time:'14:00',duration:60},
  {topic:'Mathematics practice',time:'18:00',duration:60}
 ];
 const existing=(sessionsByDate[key]||[]).filter(s=>!s.generated);
 const generated=templates.slice(0,hours).map(s=>({...s,generated:true}));
 sessionsByDate[key]=[...existing,...generated].sort((a,b)=>a.time.localeCompare(b.time));
 render();
 modal('Study schedule ready',`<p>Your ${hours}-hour study plan for ${plannerSelected.toLocaleDateString('en-US',{weekday:'long'})} is ready. ${hours} study ${hours===1?'session has':'sessions have'} been added. You can also add sessions manually.</p>`,[{text:'View schedule',primary:true,fn:close}]);
}
function settings(){modal('AI schedule settings',`<label for="hours">Study hours per day (maximum 3)</label><input id="hours" type="number" min="1" max="3" step="1" value="${hours}"><label for="exam">Upcoming exam date</label><input id="exam" type="date" value="${exam}">`,[{text:'Cancel',fn:close},{text:'Save settings',primary:true,fn:()=>{const requested=Number(document.getElementById('hours').value);if(!Number.isInteger(requested)||requested<1||requested>3){alert('Choose 1, 2, or 3 study hours per day.');return}hours=requested;exam=document.getElementById('exam').value;close();status.textContent='Schedule settings saved.'}}])}
function upload(){if(!hasFile){over(43,532,695,102,'',`background:#f4f6fd`);over(44,766,694,370,'<div style="padding:15px;color:#61708d;font-size:14px">Your summary will appear here after you choose notes and request a summary.</div>');}else if(!summary){over(44,766,694,370,'<div style="padding:15px;color:#61708d;font-size:14px">Notes selected. Choose “Summarize notes” to view your study summary.</div>');}if(hasFile&&filename!=='Bio_Ch5_Notes.pdf')textAt(75,563,520,58,esc(filename),'background:white;font-weight:bold;font-size:14px');hot(42,224,695,282,()=>modal('Choose notes',`<p>Choose a sample set of notes or select a file from your device.</p><label for="file">Choose a file</label><input type="file" id="file" accept=".pdf,.docx,.txt,image/*">`,[{text:'Cancel',fn:close},{text:'Use sample notes',primary:true,fn:()=>{hasFile=true;filename='Bio_Ch5_Notes.pdf';summary=false;close();render()}},{text:'Use selected file',fn:()=>{let f=document.getElementById('file').files[0];if(!f){alert('Choose a file first.');return}hasFile=true;filename=f.name;summary=false;close();render()}}]),'Choose notes');hot(610,530,125,104,()=>{hasFile=false;summary=false;render()},'Remove notes');hot(42,652,695,95,()=>{if(!hasFile){alert('Choose notes first.');return}summary=true;render();status.textContent='Study summary ready.'},'Summarize notes');hot(42,1157,695,94,()=>{if(!hasFile){alert('Choose notes first.');return}qi=0;answers=Array(10).fill(null);selected=null;finished=false;navigate('Practice')},'Make practice questions')}
function practice(){if(finished){navigate('Feedback');return}let q=questions[qi];over(45,220,690,145,`<div style="font-size:clamp(14px,4vw,19px);font-weight:bold;padding:12px 12px 0">Question ${qi+1} of 10 <span style="float:right;font-size:12px;color:#65718f;font-weight:normal">Multiple choice</span></div><div style="margin:9px 13px;background:#e4eaf8;border-radius:12px;height:12px"><div style="width:${(qi+1)*10}%;height:100%;background:#086ce3;border-radius:12px"></div></div>`);over(45,386,690,242,`<div style="font-size:clamp(14px,4vw,19px);font-weight:bold;padding:18px 14px">${esc(q[0])}</div>`);over(43,654,695,430,`<div style="padding:0">${q[1].map((c,i)=>`<button class="choice ${selected===i?'selected':''}" data-choice="${i}">${'ABCD'[i]}. ${esc(c)}</button>`).join('')}</div>`,`background:#f4f6fd`);root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);render()});hot(42,1098,120,90,()=>next(true),'Skip question');hot(168,1098,570,90,()=>next(false),'Submit answer')}
function next(skip){if(!skip&&selected===null){alert('Choose an answer or use Skip.');return}answers[qi]=skip?-1:selected;qi++;selected=null;if(qi===questions.length){finished=true;navigate('Feedback')}else render()}
function results(){let total=answers.filter((a,i)=>a===questions[i][2]).length;let topics=['Cell structure','Photosynthesis','Cellular respiration'];let scores=topics.map(t=>{let indices=questions.map((q,i)=>q[3]===t?i:-1).filter(i=>i>=0);return {name:t,correct:indices.filter(i=>answers[i]===questions[i][2]).length,total:indices.length}});return{total,scores}}
function feedback(){if(!finished){over(43,222,695,900,`<div style="text-align:center;padding:70px 20px"><h2>No quiz results yet</h2><p>Complete a practice quiz to see your score, topic breakdown, and recommendations.</p><button class="btn primary" id="startQuiz">Start practice quiz</button></div>`,`background:#f4f6fd`);root.querySelector('#startQuiz').onclick=()=>{qi=0;selected=null;answers=Array(10).fill(null);navigate('Practice')};return}let r=results();over(45,224,690,191,`<div style="text-align:center;padding:15px 0"><div style="font-size:clamp(25px,9vw,44px);font-weight:bold;color:#086ce3">${r.total} / 10</div><div style="color:#64718e">${r.total*10}% correct</div></div>`);r.scores.forEach((s,i)=>{let y=442+i*164,rate=Math.round(s.correct/s.total*100);over(45,y,690,140,`<div style="padding:15px 14px"><b style="font-size:clamp(13px,3.8vw,17px)">${s.name}</b><span style="float:right;color:#65718f">${rate}%</span><div style="margin-top:12px;background:#e1e8f8;border:2px solid #343434;border-radius:12px;height:14px"><div style="width:${rate}%;background:#086ce3;height:100%;border-radius:12px"></div></div></div>`)});let weak=r.scores.slice().sort((a,b)=>a.correct/a.total-b.correct/b.total)[0];over(45,936,690,180,`<div style="padding:18px 15px"><b style="font-size:16px">AI feedback</b><p style="font-size:13px;line-height:1.5">Your strongest topic is ${esc(r.scores.slice().sort((a,b)=>b.correct/b.total-a.correct/a.total)[0].name)}. Consider reviewing ${esc(weak.name)} before your exam.</p></div>`);hot(42,1144,697,93,review,'Review missed questions');hot(42,1257,697,94,()=>{qi=0;selected=null;answers=Array(10).fill(null);finished=false;navigate('Practice')},'Practice weak topics again')}
function review(){let missed=questions.map((q,i)=>({q,i})).filter(({q,i})=>answers[i]!==q[2]);modal('Missed questions',missed.length?missed.map(({q,i})=>`<div class="reviewitem"><b>Question ${i+1}: ${esc(q[0])}</b>Your answer: ${answers[i]===-1?'Skipped':esc(q[1][answers[i]])}<br>Correct: ${esc(q[1][q[2]])}</div>`).join(''):'<p>Great work — no missed questions.</p>',[{text:'Close',primary:true,fn:close}])}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
